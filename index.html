      background:theme===v?C.acL:C.surf,
      color:theme===v?C.ac:C.txS});
    b.textContent=lbl;
    b.onclick=()=>{
      theme=v;setTheme(v);
      themeRow.querySelectorAll('div').forEach((el,i)=>{
        const tv=i===0?'light':'dark';
        el.style.border=`2px solid ${tv===v?C.ac:C.brd}`;
        el.style.background=tv===v?C.acL:C.surf;
        el.style.color=tv===v?C.ac:C.txS;
      });
    };
    themeRow.appendChild(b);
  });

  const nameInp=inp({value:name,placeholder:'Иванов Иван Иванович',onInput:v=>name=v});
  const phoneInp=inp({value:phone,placeholder:'+7 (999) 000-00-00',onInput:v=>phone=v});
  const subjInp=inp({value:subj,placeholder:'Математика, физика...',onInput:v=>subj=v});

  const content=[
    dv({display:'flex',alignItems:'center',gap:'1rem',padding:'1rem 1.5rem',
      background:C.acL,borderRadius:'12px',marginBottom:'1.25rem'},
      av(p.avatar_text||'??',rColor(p.role),48),
      dv({},
        dv({fontWeight:'800',fontSize:'1.05rem',color:C.tx},p.full_name||'—'),
        dv({fontSize:'.8rem',color:C.txS,marginTop:'2px'},p.email||''),
        badge(rLabel(p.role),p.role==='manager'?'amber':p.role==='teacher'?'blue':'green')
      )
    ),
    fld('Полное имя',nameInp),
    fld('Телефон',phoneInp),
    p.role==='teacher'?fld('Дисциплина',subjInp):dv({}),
    fld('Тема оформления',themeRow),
    dv({display:'flex',justifyContent:'flex-end',gap:'.75rem',marginTop:'.5rem'},
      btn('Отмена',()=>m.remove(),{variant:'secondary'}),
      btn('Сохранить',async()=>{
        if(!name.trim()){toast('Введите имя','err');return;}
        const upd={full_name:name,phone:phone,avatar_text:ini(name)};
        if(p.role==='teacher') upd.subject=subj;
        const{error}=await sb.from('profiles').update(upd).eq('id',p.id);
        if(error){toast('Ошибка: '+error.message,'err');return;}
        S.prof={...S.prof,...upd};
        toast('Профиль обновлён');m.remove();render();
      },{variant:'primary'})
    )
  ];
  const m=modal('Мой профиль',content,()=>m.remove());
  document.body.appendChild(m);
}


// ─── MOBILE UI HELPERS ─────────────────────────────────────────
const isMob=()=>window.innerWidth<=768;

// Mobile greeting header
function mobGreeting(name,subtitle){
  const w=dv({});w.className='mob-greeting';
  w.appendChild(Object.assign(document.createElement('div'),{className:'mob-greeting-name',textContent:'Добрый день, '+name.split(' ')[0]+'!'}));
  if(subtitle)w.appendChild(Object.assign(document.createElement('div'),{className:'mob-greeting-date',textContent:subtitle}));
  return w;
}

// Large hero action card (like "Продолжить обучение" in Teachbase)
function mobHeroCard(title,sub,gradient,onClick){
  const c=document.createElement('div');c.className='mob-hero-card';
  c.style.background=gradient||`linear-gradient(135deg,${C.ac},#e8955a)`;
  const txt=dv({paddingRight:'3rem'});
  txt.appendChild(Object.assign(document.createElement('div'),{className:'mob-hero-title',textContent:title}));
  if(sub)txt.appendChild(Object.assign(document.createElement('div'),{className:'mob-hero-sub',textContent:sub}));
  c.appendChild(txt);
  const arr=document.createElement('div');arr.className='mob-hero-arrow';
  arr.innerHTML='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>';
  c.appendChild(arr);
  if(onClick)c.onclick=onClick;
  return c;
}

// 2-column action button grid item
function mobActionBtn(icon,iconColor,iconBg,label,sub,onClick){
  const b=document.createElement('button');b.className='mob-action-btn';
  const ico=document.createElement('div');ico.className='mob-action-icon';ico.style.background=iconBg;
  ico.appendChild(ic(icon,20,iconColor));
  b.appendChild(ico);
  b.appendChild(Object.assign(document.createElement('div'),{className:'mob-action-label',textContent:label}));
  if(sub)b.appendChild(Object.assign(document.createElement('div'),{className:'mob-action-sub',textContent:sub}));
  if(onClick)b.onclick=onClick;
  return b;
}

// List item row (like course/lecture/task row on mobile)
function mobListItem(iconName,iconColor,iconBg,title,sub,rightEl,onClick){
  const row=document.createElement('div');row.className='mob-list-item';
  const ico=document.createElement('div');ico.className='mob-list-icon';ico.style.background=iconBg;
  ico.appendChild(ic(iconName,22,iconColor));row.appendChild(ico);
  const body=document.createElement('div');body.className='mob-list-body';
  body.appendChild(Object.assign(document.createElement('div'),{className:'mob-list-title',textContent:title}));
  if(sub)body.appendChild(Object.assign(document.createElement('div'),{className:'mob-list-sub',textContent:sub}));
  row.appendChild(body);
  if(rightEl){const r=document.createElement('div');r.className='mob-list-right';r.appendChild(rightEl);row.appendChild(r);}
  if(onClick)row.onclick=onClick;
  return row;
}

// Section title
function mobTitle(text){
  return Object.assign(document.createElement('div'),{className:'mob-section-title',textContent:text});
}

async function render(){
  const app=document.getElementById('app');if(!app)return;app.innerHTML='';
  const{loading,user,prof,nav,cid}=S;
  if(loading){app.appendChild(dv({minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:C.bg},spin()));return;}
  if(!user||!prof){app.appendChild(pgLogin());return;}
  const layout=document.createElement('div');layout.className='app-layout';
  document.querySelectorAll('.sb-overlay,.mob-nav,.mob-bar').forEach(el=>el.remove());
  const sOverlay=document.createElement('div');sOverlay.className='sb-overlay';
  sOverlay.onclick=()=>{document.querySelector('.app-sidebar')?.classList.remove('open');sOverlay.classList.remove('on');};
  document.body.appendChild(sOverlay);
  const sbResult=pgSidebar(sOverlay);
  // pgSidebar returns a fragment with [mob-bar, aside] - separate them
  if(sbResult instanceof DocumentFragment){
    const children=Array.from(sbResult.childNodes);
    children.forEach(child=>{
      if(child.classList&&child.classList.contains('mob-bar')){
        document.body.insertBefore(child,document.body.firstChild);
      } else {
        layout.appendChild(child);
      }
    });
  } else {
    layout.appendChild(sbResult);
  }
  const main=document.createElement('main');main.className='app-main';main.style.background=C.bg;
  const isM=prof.role==='manager';const isT=prof.role==='teacher';const isSt=prof.role==='student';
  // Course detail — async load if needed
  if(nav==='course'&&cid){
    if(S.cloading){main.appendChild(spin());}
    else if(!S.cd||S.cd.id!==cid){
      // Запускаем загрузку, показываем спиннер
      main.appendChild(spin());layout.appendChild(main);app.appendChild(layout);
      loadCourseDetail(cid);return;
    } else {
      main.appendChild(pgCourseDetail());
    }
  }else if(isM&&nav==='dashboard')main.appendChild(pgDashboard());
  else if(isM&&nav==='courses')main.appendChild(pgCourses());
  else if(isM&&nav==='cal')main.appendChild(pgCal());
  else if(isM&&nav==='tasks')main.appendChild(pgTasks());
  else if(isM&&nav==='teachers')main.appendChild(pgTeachers());
  else if(nav==='msgs')main.appendChild(pgMsgs());
  else if(isM&&nav==='search')main.appendChild(pgSearch());
  else if(isT&&nav==='t-home')main.appendChild(pgTHome());
  else if(isT&&nav==='t-sched')main.appendChild(pgTSched());
  else if(isT&&nav==='t-tasks')main.appendChild(pgTTasks());
  else if(isT&&nav==='t-cal')main.appendChild(pgCal());
  else if(isT&&nav==='t-hw'){const hw=dv({});pgTHW().then(n=>{hw.appendChild(n);});main.appendChild(hw);}
  else if(isSt&&nav==='s-home')main.appendChild(pgSHome());
  else if(isSt&&nav==='s-sched')main.appendChild(pgSSched());
  else if(isSt&&nav==='s-mats')main.appendChild(pgSMats());
  else if(isSt&&nav==='s-docs')main.appendChild(pgSDocs());
  else if(isSt&&nav==='s-hw'){const shw=dv({});pgSHW().then(n=>{shw.appendChild(n);});main.appendChild(shw);}
  else main.appendChild(spin());
  layout.appendChild(main);app.appendChild(layout);
}

render();

// ─── BOOT ────────────────────────────────────────────────
async function boot(){
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session){
      const p=await loadProf(session.user.id);
      if(p){
        await loadAll(p);
        subMsgs(p);
        try{requestNotifyPerm();}catch(e){}
        setS({user:session.user,prof:p,loading:false,nav:defNav(p)});
      }else{
        await sb.auth.signOut();
        setS({loading:false});
      }
    }else{
      setS({loading:false});
    }
  }catch(e){
    console.error('Boot error:',e);
    setS({loading:false});
  }
}
// Run after DOM is ready
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', boot);
}else{
  boot();
}

// ── PWA SERVICE WORKER REGISTRATION ──────────────────────
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW not available:', err.message));
  });
}

// ── PWA INSTALL PROMPT ────────────────────────────────────
let _installPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _installPrompt = e;
  // Show install button in topbar after 3 seconds
  setTimeout(() => {
    const topbar = document.querySelector('.mob-bar');
    if (!topbar || document.querySelector('.pwa-install-btn')) return;
    const btn = document.createElement('button');
    btn.className = 'pwa-install-btn';
    Object.assign(btn.style, {
      background: '#C17A3E', color: '#fff', border: 'none',
      borderRadius: '8px', padding: '5px 10px', fontSize: '.75rem',
      fontWeight: '700', cursor: 'pointer', display: 'flex',
      alignItems: 'center', gap: '4px', flexShrink: '0'
    });
    btn.innerHTML = '⬇️ Установить';
    btn.onclick = () => {
      _installPrompt.prompt();
      _installPrompt.userChoice.then(() => { _installPrompt = null; btn.remove(); });
    };
    topbar.appendChild(btn);
  }, 3000);
});
