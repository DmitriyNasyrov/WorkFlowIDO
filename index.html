<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="EduFlow">
<meta name="theme-color" content="#C17A3E">
<meta name="description" content="Платформа управления образовательными курсами">
<link rel="manifest" href="/manifest.json">
<!-- iOS иконки (inline SVG → base64) -->
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%23C17A3E'/><text y='125' x='90' text-anchor='middle' font-size='100' font-family='sans-serif'>📚</text></svg>">
<title>EduFlow</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.3/dist/umd/supabase.js" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Plus Jakarta Sans',sans-serif;background:#F7F5F2;color:#1A1714;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
#app{min-height:100dvh;overflow-x:hidden}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:#D4CCC0;border-radius:9px}
input,select,textarea,button{font-family:inherit;-webkit-appearance:none;outline:none}
input:focus,textarea:focus,select:focus{outline:2px solid #C17A3E44;outline-offset:-1px}
a{color:#3B6FD4;text-decoration:none}
table{border-collapse:collapse;width:100%;table-layout:fixed}
td,th{word-break:break-word;overflow-wrap:anywhere}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fadeIn .2s ease}

/* ── LAYOUT ───────────────────────────────────────── */
.app-layout{display:flex;min-height:100dvh}
.app-sidebar{width:220px;flex-shrink:0;position:sticky;top:0;height:100dvh;overflow-y:auto;transition:transform .26s cubic-bezier(.4,0,.2,1)}
.app-main{flex:1;overflow-y:auto;overflow-x:hidden;max-height:100dvh;background:#F7F5F2;min-width:0}

/* ── PAGE CONTAINERS ──────────────────────────────── */
.page{padding:1.75rem 2rem 2rem}
.page-wide{padding:1.75rem 2rem 2rem;max-width:1280px}

/* ── GRIDS ────────────────────────────────────────── */
.grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.grid-auto{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.grid-cal{display:grid;grid-template-columns:1fr 290px;gap:1.25rem;align-items:start}

/* ── TABS (scrollable) ────────────────────────────── */
.tab-bar{display:flex;gap:2px;background:#fff;border:1px solid #E8E3DA;border-radius:10px;padding:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;white-space:nowrap}
.tab-bar::-webkit-scrollbar{display:none}
.tab-btn{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:.82rem;font-weight:600;transition:all .1s;white-space:nowrap;flex-shrink:0;border:none;background:transparent;color:#6B6560}
.tab-btn.on{background:#F7F5F2;color:#1A1714;box-shadow:0 1px 3px rgba(26,23,20,.08)}

/* ── SIDEBAR OVERLAY ──────────────────────────────── */
.sb-overlay{display:none;position:fixed;inset:0;background:rgba(26,23,20,.45);z-index:299;opacity:0;transition:opacity .25s;pointer-events:none}
.sb-overlay.on{opacity:1;pointer-events:auto}

/* ── iOS TOP BAR ──────────────────────────────────── */
.mob-bar{display:none;position:sticky;top:0;z-index:150;background:rgba(247,245,242,.92);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);border-bottom:1px solid rgba(232,227,218,.7);padding:.5rem .875rem;align-items:center;gap:.625rem;min-height:52px}
.mob-bar-title{flex:1;font-weight:800;font-size:1rem;color:#1A1714;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── iOS BOTTOM TAB BAR ───────────────────────────── */
.mob-nav{display:none;position:fixed;bottom:0;left:0;right:0;z-index:200;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(28px);backdrop-filter:blur(28px);border-top:1px solid rgba(232,227,218,.8);padding-bottom:env(safe-area-inset-bottom,0)}
.mob-nav-inner{display:flex;align-items:stretch}
.mob-nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:6px 4px 8px;gap:3px;color:#9E9890;font-size:.6rem;font-weight:700;letter-spacing:.005em;min-height:54px;border:none;background:none;cursor:pointer;transition:color .15s;position:relative;-webkit-tap-highlight-color:transparent;user-select:none}
.mob-nav-btn.on{color:#C17A3E}
.mob-nav-icon{display:flex;align-items:center;justify-content:center;width:46px;height:30px;border-radius:13px;transition:background .15s,transform .1s}
.mob-nav-btn.on .mob-nav-icon{background:rgba(193,122,62,.12)}
.mob-nav-btn:active .mob-nav-icon{transform:scale(.88)}
.mob-nav-lbl{font-size:.59rem;font-weight:700;letter-spacing:.01em;transition:color .15s}
.mob-nav-dot{position:absolute;top:5px;right:calc(50% - 22px);background:#C17A3E;color:#fff;border-radius:999px;font-size:.55rem;font-weight:800;padding:1px 5px;min-width:16px;text-align:center;line-height:1.5;border:2px solid rgba(255,255,255,.9)}

/* ── STAT CARDS (mobile-native) ───────────────────── */
.stat-card{background:#fff;border-radius:18px;padding:1rem;display:flex;flex-direction:column;gap:.25rem;box-shadow:0 1px 4px rgba(26,23,20,.07),0 0 0 1px rgba(26,23,20,.05)}
.stat-card-val{font-size:1.6rem;font-weight:800;line-height:1;letter-spacing:-.03em}
.stat-card-lbl{font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#9E9890}
.stat-card-sub{font-size:.75rem;color:#9E9890;margin-top:.125rem}

/* ── CHAT ─────────────────────────────────────────── */
.chat-wrap{display:flex;height:100dvh;overflow:hidden}
.chat-side{width:270px;min-width:270px;border-right:1px solid #E8E3DA;display:flex;flex-direction:column;background:#fff;flex-shrink:0}
.chat-body{flex:1;display:flex;flex-direction:column;min-width:0;background:#F7F5F2}

/* ── MODAL ────────────────────────────────────────── */
.modal-wrap{position:fixed;inset:0;background:rgba(26,23,20,.5);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:center;justify-content:center;padding:1rem}
.modal-inner{background:#fff;border:1px solid #E8E3DA;border-radius:22px;width:500px;max-width:calc(100vw - 2rem);max-height:88dvh;overflow-y:auto;overflow-x:hidden}

/* ── LOGIN PAGE ───────────────────────────────────── */
.login-wrap{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#F7F5F2;padding:1.5rem}
.login-box{background:#fff;border-radius:24px;width:420px;max-width:100%;padding:2rem 2.25rem;box-shadow:0 8px 40px rgba(26,23,20,.1),0 0 0 1px rgba(26,23,20,.06);flex-shrink:0}
@media(max-width:500px){
  .login-wrap{padding:0;align-items:flex-start}
  .login-box{border-radius:0;width:100%;min-height:100dvh;padding:2rem 1.25rem;box-shadow:none;display:flex;flex-direction:column;justify-content:center}
}

/* ── DARK THEME ───────────────────────────────────── */
[data-theme="dark"] body,[data-theme="dark"] #app{background:#1A1714;color:#F0EDE8}
[data-theme="dark"] .app-main{background:#1A1714}
[data-theme="dark"] .app-sidebar{background:#232018!important;border-color:#38332E!important}
[data-theme="dark"] .mob-bar{background:rgba(26,23,20,.95)!important;border-color:#38332E!important}
[data-theme="dark"] .mob-nav{background:rgba(26,23,20,.97)!important;border-color:#38332E!important}
[data-theme="dark"] .tab-bar{background:#232018;border-color:#38332E}
[data-theme="dark"] .tab-btn.on{background:#2A2520;color:#F0EDE8}
[data-theme="dark"] .modal-inner{background:#232018;border-color:#38332E}
[data-theme="dark"] .stat-card{background:#232018;box-shadow:0 1px 4px rgba(0,0,0,.3),0 0 0 1px rgba(255,255,255,.05)}
[data-theme="dark"] .login-box{background:#232018;border-color:#38332E}

/* ── MOBILE ───────────────────────────────────────── */
@media(max-width:768px){
  .app-sidebar{position:fixed;left:0;top:0;bottom:0;z-index:300;transform:translateX(-260%);width:260px}
  .app-sidebar.open{transform:translateX(0);box-shadow:0 0 0 100vw transparent,4px 0 32px rgba(26,23,20,.2)}
  .app-main{max-height:calc(100dvh - 52px);overflow-x:hidden}
  .sb-overlay{display:block}
  .mob-bar{display:flex}
  .mob-nav{display:flex}
  .page,.page-wide{padding:.875rem .875rem 96px}
  .grid-4{grid-template-columns:1fr 1fr;gap:.625rem}
  .grid-3{grid-template-columns:1fr 1fr;gap:.625rem}
  .grid-2{grid-template-columns:1fr}
  .grid-auto{grid-template-columns:1fr}
  .grid-cal{grid-template-columns:1fr}
  .cal-side-col{display:none}
  .chat-wrap{flex-direction:column;height:auto;min-height:calc(100dvh - 106px)}
  .chat-side{width:100%;min-width:unset;border-right:none;border-bottom:1px solid #E8E3DA;max-height:38vh;overflow-y:auto}
  .chat-body{flex:1;min-height:45vh}
  .hide-mob{display:none!important}
  .modal-wrap{align-items:flex-end;padding:0;overflow:hidden}
  .modal-inner{width:100vw!important;max-width:100vw!important;border-radius:24px 24px 0 0!important;max-height:94dvh!important}
  table{display:block;overflow-x:auto;-webkit-overflow-scrolling:touch}
  .tab-bar{margin-left:-.875rem;margin-right:-.875rem;padding:4px .875rem;border-radius:0;border-left:none;border-right:none}
}
@media(max-width:390px){
  .page,.page-wide{padding:.75rem .75rem 96px}
  .grid-4{grid-template-columns:1fr 1fr;gap:.5rem}
  .grid-3{grid-template-columns:1fr 1fr;gap:.5rem}
  .stat-card{padding:.875rem}
  .stat-card-val{font-size:1.4rem}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
// Global error boundary
window.onerror = function(msg, src, line, col, err) {
  var app = document.getElementById('app');
  if (app) app.innerHTML = '<div style="padding:2rem;font-family:sans-serif;color:#c0392b;background:#fdf0ee;border-radius:12px;margin:2rem;border:1px solid #f0bcba"><b>Ошибка запуска:</b><br>' + msg + '<br><small>' + (src||'') + ':' + line + '</small></div>';
  console.error('EduFlow error:', msg, src, line, col, err);
  return false;
};

const SURL='https://hsuuexuvabetdpxjzrsy.supabase.co';
const SKEY='sb_publishable_rXch-XX6q1FlK75llS_mJA_vurNQzTn';
const sb=supabase.createClient(SURL,SKEY);

const C={bg:'#F7F5F2',surf:'#fff',surfH:'#F2EFE9',brd:'#E8E3DA',brdS:'#D4CCC0',
  tx:'#1A1714',txS:'#6B6560',txT:'#9E9890',
  ac:'#C17A3E',acL:'#FDF3E7',acB:'#EDD5AE',
  bl:'#3B6FD4',blL:'#EEF3FF',blB:'#C0D0F0',
  gr:'#2D7D52',grL:'#EDFAF3',grB:'#A8DFC1',
  rd:'#C0392B',rdL:'#FDF0EE',rdB:'#F0BCBA',
  yw:'#B07A1A',ywL:'#FEF9EC',ywB:'#F0DCAA',
  pu:'#6B3FA0',puL:'#F3EEFF',puB:'#CEBBF0',
  sh:'0 1px 3px rgba(26,23,20,.07)',shM:'0 4px 16px rgba(26,23,20,.09)',shL:'0 12px 36px rgba(26,23,20,.13)'};

const today=()=>new Date().toISOString().split('T')[0];
const daysUntil=d=>{if(!d)return 999;return Math.ceil((new Date(d)-new Date(today()))/86400000);};
const fmt=d=>d?new Date(d).toLocaleDateString('ru-RU',{day:'2-digit',month:'short',year:'numeric'}):'—';
const fmtS=d=>d?new Date(d).toLocaleDateString('ru-RU',{day:'2-digit',month:'short'}):'—';
const fmtT=ts=>{try{return new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});}catch{return '';}};
const pct=c=>{try{const tot=new Date(c.end_date)-new Date(c.start_date);const pas=new Date(today())-new Date(c.start_date);if(!tot||isNaN(tot))return 0;return Math.max(0,Math.min(100,Math.round((pas/tot)*100)));}catch{return 0;}};
const ini=n=>(n||'').split(' ').map(w=>w[0]||'').join('').toUpperCase().slice(0,2)||'??';
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rColor=r=>({manager:C.ac,teacher:C.bl,student:C.gr}[r]||C.txT);
const rLabel=r=>({manager:'Менеджер',teacher:'Преподаватель',student:'Слушатель'}[r]||r);
const defNav=p=>p.role==='manager'?'dashboard':p.role==='teacher'?'t-home':'s-home';

const CQ=`*,course_managers(manager_id,profiles!course_managers_manager_id_fkey(id,full_name,avatar_text,email)),course_teachers(*,profiles!course_teachers_teacher_id_fkey(id,full_name,avatar_text,email,phone,subject)),students(*),lectures(*,profiles!lectures_teacher_id_fkey(id,full_name,avatar_text)),tasks(*)`;

let S={user:null,prof:null,loading:true,courses:[],msgs:[],allP:[],personalTasks:[],nav:null,cid:null,cd:null,cloading:false,activeTab:'teachers'};
let rtCh=null;
// ── KEY FIX: setState never triggers render during data load ──
function setS(p,rerender=true){Object.assign(S,p);if(rerender)render();}

// ─── AUTH ──────────────────────────────────────
async function loadProf(uid){
  for(let i=0;i<10;i++){const{data}=await sb.from('profiles').select('*').eq('id',uid).single();if(data)return data;await sleep(600);}
  return null;
}
async function signUp(email,pw,meta){
  // Sanitize role — must be one of the allowed values
  const allowedRoles=['manager','teacher','student'];
  const safeRole=allowedRoles.includes(meta.role)?meta.role:'student';
  const safeMeta={...meta,role:safeRole};
  
  const{data,error}=await sb.auth.signUp({email,password:pw,options:{data:safeMeta}});
  if(error||!data?.user)return{error:error||{message:'Ошибка регистрации'}};
  
  const pl={
    id:data.user.id,
    full_name:safeMeta.full_name||email.split('@')[0],
    email,
    role:safeRole,
    avatar_text:ini(safeMeta.full_name||email),
    subject:safeMeta.subject||null,
    phone:null
  };
  
  // Try insert, then upsert as fallback
  const{error:e2}=await sb.from('profiles').insert(pl);
  if(e2){
    console.log('Insert failed, trying upsert:', e2.message);
    const{error:e2b}=await sb.from('profiles').upsert(pl,{onConflict:'id'});
    if(e2b){console.error('Upsert also failed:', e2b.message);}
  }
  
  // Small delay to let trigger fire
  await sleep(500);
  
  const{error:e3}=await sb.auth.signInWithPassword({email,password:pw});
  if(e3)return{error:e3};
  return{error:null};
}
async function signIn(email,pw){const{error}=await sb.auth.signInWithPassword({email,password:pw});return error;}
async function signOut(){
  if(rtCh){sb.removeChannel(rtCh);rtCh=null;}
  await sb.auth.signOut();
  setS({user:null,prof:null,nav:null,courses:[],msgs:[],allP:[],cd:null,cid:null});
}

// ─── DATA ──────────────────────────────────────
async function loadAll(prof){
  if(prof.role==='student'){await loadStudentData(prof);}
  else{await Promise.all([loadCourses(prof),loadMsgs(prof),loadAllP()]);}
  // Load personal tasks (no course) for all roles
  try{
    const{data:pt}=await sb.from('tasks').select('*').is('course_id',null).eq('created_by',prof.id);
    S.personalTasks=pt||[];
  }catch(e){S.personalTasks=[];}
}
async function loadStudentData(prof){
  // Try email match first
  const{data:st}=await sb.from('students').select('*,courses('+CQ+')').eq('email',prof.email).maybeSingle();
  let courses=[];
  if(st?.courses){
    courses=[st.courses];
  } else {
    // Fallback: try case-insensitive email, or ilike
    const{data:st2}=await sb.from('students').select('*,courses('+CQ+')').ilike('email',prof.email).maybeSingle();
    if(st2?.courses) courses=[st2.courses];
  }
  S.courses=courses;S.allP=[];
  await loadMsgs(prof);
  await loadAllP();
}
async function loadCourses(prof){
  let q=sb.from('courses').select(CQ).order('created_at',{ascending:false});
  if(prof.role==='teacher'){
    const{data:r}=await sb.from('course_teachers').select('course_id').eq('teacher_id',prof.id);
    const ids=(r||[]).map(x=>x.course_id);
    if(!ids.length){S.courses=[];return;}
    q=q.in('id',ids);
  }
  const{data}=await q;S.courses=data||[];
}
async function loadMsgs(prof){
  const{data}=await sb.from('messages').select(`*,sender:profiles!messages_sender_id_fkey(id,full_name,avatar_text,role,email),receiver:profiles!messages_receiver_id_fkey(id,full_name,avatar_text,role,email)`).or(`sender_id.eq.${prof.id},receiver_id.eq.${prof.id}`).order('created_at');
  S.msgs=data||[];
}
async function loadAllP(){const{data}=await sb.from('profiles').select('*');S.allP=data||[];}

// ── CRITICAL FIX: reload course detail WITHOUT triggering mid-render setState ──
async function reloadCourse(){
  const id=S.cid;if(!id)return;
  const{data}=await sb.from('courses').select(CQ).eq('id',id).single();
  await loadCourses(S.prof);
  S.cd=data;
  render(); // render() rebuilds DOM including pgCourseDetail which sets S._showTab
  // S.activeTab was preserved, pgCourseDetail reads it via S.activeTab
}

async function loadCourseDetail(id){
  S.cloading=true;
  const{data}=await sb.from('courses').select(CQ).eq('id',id).single();
  if(S.nav==='course'&&S.cid===id){S.cd=data;S.cloading=false;render();}
  else{S.cloading=false;}
}

function subMsgs(prof){
  if(rtCh)sb.removeChannel(rtCh);
  rtCh=sb.channel('msgs').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},async()=>{
    await loadMsgs(prof);checkNewMsgs();
    if(typeof window._msgRefresh==='function'){window._msgRefresh();}
    else{render();}
  }).subscribe();
}
// ── BROWSER NOTIFICATIONS ──────────────────────────────
function requestNotifyPerm(){if('Notification'in window&&Notification.permission==='default')Notification.requestPermission();}
function sendNotify(title,body,onClick){
  if(!('Notification'in window)||Notification.permission!=='granted')return;
  const n=new Notification(title,{body});
  if(onClick)n.onclick=()=>{window.focus();n.close();onClick();};
  setTimeout(()=>n.close(),5000);
}
let _lastUnread=0;
function checkNewMsgs(){
  const unread=(S.msgs||[]).filter(m=>m.receiver_id===S.prof?.id&&!m.read);
  if(unread.length>_lastUnread&&_lastUnread>=0){
    const newest=unread.slice(-1)[0];const sender=(S.allP||[]).find(p=>p.id===newest?.sender_id);
    if(sender&&newest)sendNotify('EduFlow: '+sender.full_name,newest.content,()=>setS({nav:'msgs'}));
  }
  _lastUnread=unread.length;
}
// ── CSV EXPORT ─────────────────────────────────────────
function exportCSV(rows,filename){
  const csv=rows.map(r=>r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')).join('\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=filename;
  document.body.appendChild(a);a.click();document.body.removeChild(a);toast('Файл скачан');
}
function exportStudents(course){
  const rows=[['ФИО','Email','Телефон','Организация','Паспорт','Диплом','Заявление','Договор','Оплата']];
  (course.students||[]).forEach(s=>rows.push([s.full_name,s.email||'',s.phone||'',s.organization||'',s.has_passport?'Да':'',s.has_diploma?'Да':'',s.has_statement?'Да':'',s.has_contract?'Да':'',s.has_payment?'Да':'']));
  exportCSV(rows,(course.title||'course').replace(/\s+/g,'_')+'_слушатели.csv');
}
function exportFinance(course){
  const rows=[['Преподаватель','Дисциплина','Часов','Ставка','Итого','Оплачено']];
  (course.course_teachers||[]).forEach(ct=>rows.push([ct.profiles?.full_name||'',ct.subject||'',ct.hours||0,ct.rate||0,(ct.hours||0)*(ct.rate||0),ct.paid?'Да':'Нет']));
  exportCSV(rows,(course.title||'course').replace(/\s+/g,'_')+'_финансы.csv');
}

function pgLogin(){
  let mode='login',fn='',role='manager',subj='',email='',pw='',showPw=false;
  const wrap=dv({});wrap.className='login-wrap';
  const box=dv({});box.className='login-box';
  const logoW=dv({textAlign:'center',marginBottom:'2rem'});
  const logoIc=dv({width:'52px',height:'52px',borderRadius:'14px',background:`linear-gradient(135deg,${C.ac},#e8955a)`,display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 1rem',boxShadow:`0 4px 16px ${C.ac}44`});

  logoW.appendChild(hx(1,{margin:'0 0 .4rem',fontSize:'1.4rem',fontWeight:'800',color:C.tx},'EduFlow'));
  logoW.appendChild(dv({color:C.txS,fontSize:'.875rem'},'Управление образовательными курсами'));

  const tabBar=dv({display:'flex',gap:'4px',padding:'3px',background:C.bg,borderRadius:'9px',border:`1px solid ${C.brd}`,marginBottom:'1.5rem'});
  const tBtns={};
  [['login','Войти'],['register','Регистрация']].forEach(([v,l])=>{
    const b=document.createElement('button');b.textContent=l;
    Object.assign(b.style,{flex:'1',padding:'6px',borderRadius:'7px',border:'none',background:v===mode?C.surf:'transparent',color:v===mode?C.tx:C.txS,fontWeight:'600',cursor:'pointer',fontSize:'.84rem',boxShadow:v===mode?C.sh:'none',transition:'all .1s'});
    b.onclick=()=>sw(v);tBtns[v]=b;tabBar.appendChild(b);
  });box.appendChild(tabBar);
  const fa=dv({});box.appendChild(fa);
  const errBox=dv({display:'none',padding:'.6rem .875rem',background:C.rdL,border:`1px solid ${C.rdB}`,borderRadius:'8px',color:C.rd,fontSize:'.82rem',marginBottom:'1rem'});box.appendChild(errBox);
  function showErr(m){errBox.textContent=m||'';errBox.style.display=m?'block':'none';}

  function buildForm(){
    fa.innerHTML='';
    if(mode==='register'){
      fa.appendChild(fld('ФИО',inp({placeholder:'Иванова Елена Сергеевна',value:fn,onInput:v=>fn=v})));
      fa.appendChild(fld('Роль',sel([['manager','Менеджер курсов'],['teacher','Преподаватель'],['student','Слушатель']],role,v=>{role=v;buildForm();})));
      if(role==='teacher')fa.appendChild(fld('Дисциплина',inp({placeholder:'Управление проектами',value:subj,onInput:v=>subj=v})));
      if(role==='student')fa.appendChild(dv({padding:'.75rem',background:C.ywL,border:`1px solid ${C.ywB}`,borderRadius:'9px',marginBottom:'1rem',fontSize:'.8rem',color:C.yw,lineHeight:'1.5'},'⚠️ Зарегистрируйтесь с тем email, который менеджер указал в списке слушателей курса.'));
    }
    fa.appendChild(fld('Email',inp({type:'email',placeholder:'email@university.ru',value:email,onInput:v=>email=v,onKey:e=>{if(e.key==='Enter')submit();}})));
    const pw2=dv({position:'relative'});
    const pi=inp({type:showPw?'text':'password',placeholder:'Минимум 6 символов',value:pw,onInput:v=>pw=v,onKey:e=>{if(e.key==='Enter')submit();},style:{paddingRight:'2.5rem'}});
    const pb=document.createElement('button');Object.assign(pb.style,{position:'absolute',right:'10px',top:'50%',transform:'translateY(-50%)',background:'none',border:'none',cursor:'pointer',color:C.txT,display:'flex',padding:'2px'});
    pb.appendChild(ic(showPw?'eyeOff':'eye',16,C.txT));pb.onclick=e=>{e.preventDefault();showPw=!showPw;buildForm();};
    pw2.appendChild(pi);pw2.appendChild(pb);fa.appendChild(fld('Пароль',pw2));

    Object.entries(tBtns).forEach(([v,b])=>{b.style.background=v===m?C.surf:'transparent';b.style.color=v===m?C.tx:C.txS;b.style.boxShadow=v===m?C.sh:'none';});
    buildForm();sb2.textContent=m==='login'?'Войти в систему':'Создать аккаунт';
  }
  async function submit(){
    showErr('');if(!email.trim()){showErr('Введите email');return;}if(!pw||pw.length<6){showErr('Пароль минимум 6 символов');return;}
    sb2.disabled=true;sb2.style.opacity='0.6';sb2.textContent='Загрузка...';

      if(err){showErr('Неверный email или пароль');sb2.disabled=false;sb2.style.opacity='1';sb2.textContent='Войти в систему';return;}
      const{data:{session}}=await sb.auth.getSession();
      if(session){const p=await loadProf(session.user.id);if(p){await loadAll(p);subMsgs(p);setS({user:session.user,prof:p,loading:false,nav:defNav(p)});}else{showErr('Профиль не найден');sb2.disabled=false;sb2.style.opacity='1';sb2.textContent='Войти в систему';}}
    }else{
      if(!fn.trim()){showErr('Введите ФИО');sb2.disabled=false;sb2.style.opacity='1';sb2.textContent='Создать аккаунт';return;}

      const{data:{session}}=await sb.auth.getSession();

    }
  }
  buildForm();
  const sb2=btn(mode==='login'?'Войти в систему':'Создать аккаунт',submit,{variant:'primary',size:'lg',full:true});
  box.appendChild(sb2);wrap.appendChild(box);return wrap;

    const list=Object.values(partners).sort((a,b)=>new Date(b.created_at)-new Date(a.created_at));
    convList.innerHTML='';
    if(!list.length){convList.appendChild(dv({padding:'2rem',textAlign:'center',color:C.txT,fontSize:'.82rem'},'Нет переписок. Нажмите «Новое»'));return;}
    list.forEach(conv=>{
      const p2=getP(conv.other);
      const unread=msgs.filter(m=>m.sender_id===conv.other&&m.receiver_id===prof.id&&!m.read).length;
      const isActive=conv.other===currentOtherId;
      const row=dv({padding:'.75rem 1rem',cursor:'pointer',
        background:isActive?C.acL:'transparent',
        borderBottom:`1px solid ${C.brd}`,
        display:'flex',gap:'.625rem',alignItems:'center',
        borderLeft:isActive?`3px solid ${C.ac}`:'3px solid transparent'});
      row.appendChild(av(p2.avatar_text,rColor(p2.role),36));
      const inf=dv({flex:'1',minWidth:'0'});
      const tr3=dv({display:'flex',justifyContent:'space-between',marginBottom:'2px',alignItems:'center'});
      tr3.appendChild(sp({fontWeight:'700',fontSize:'.84rem',color:C.tx,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'},(p2.full_name||'').split(' ').slice(0,2).join(' ')));
      const rm=dv({display:'flex',gap:'4px',alignItems:'center',flexShrink:'0'});
      if(unread>0)rm.appendChild(sp({background:C.ac,color:'#fff',borderRadius:'999px',fontSize:'.65rem',fontWeight:'700',padding:'1px 7px'},String(unread)));
      rm.appendChild(sp({fontSize:'.68rem',color:C.txT},fmtT(conv.created_at)));
      tr3.appendChild(rm);
      inf.appendChild(tr3);
      const lastMsg=(conv.content||'');
      inf.appendChild(dv({fontSize:'.76rem',color:isActive?C.ac:C.txS,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',fontWeight:unread>0?'600':'400'},lastMsg.length>42?lastMsg.slice(0,42)+'…':lastMsg));
      row.appendChild(inf);
      row.onmouseenter=()=>{if(!isActive)row.style.background=C.surfH;};
      row.onmouseleave=()=>{if(!isActive)row.style.background='transparent';};
      row.onclick=()=>{
        if(unread>0){sb.from('messages').update({read:true}).eq('sender_id',conv.other).eq('receiver_id',prof.id).eq('read',false).then(()=>loadMsgs(S.prof).then(()=>refreshConvList()));}
        openChat(conv.other);
      };
      convList.appendChild(row);
    });
  }

  // ОТКРЫТЬ ЧАТ
  function openChat(otherId){
    currentOtherId=otherId;
    refreshConvList();
    // Если чат уже открыт для другого - пересоздаём
    const existingHeader=chatA.querySelector('.chat-header');
    const headerPerson=chatA.querySelector('[data-other-id]');
    if(!existingHeader||chatA.dataset.otherId!==otherId){
      chatA.dataset.otherId=otherId;
      buildChatUI(otherId);
    } else {
      renderMessages(otherId);
    }
  }

  let chatInputRef=null;

  function buildChatUI(otherId){
    const allP=S.allP;
    const getP=id=>allP.find(p=>p.id===id)||{full_name:'?',avatar_text:'?',role:'manager'};
    const person=getP(otherId);
    chatA.innerHTML='';

    // Header
    const hdr=dv({padding:'1rem 1.5rem',background:C.surf,borderBottom:`1px solid ${C.brd}`,display:'flex',alignItems:'center',gap:'.875rem',flexShrink:'0'});
    hdr.className='chat-header';
    hdr.appendChild(av(person.avatar_text,rColor(person.role),40));
    const pi=dv({flex:'1'});
    pi.appendChild(dv({fontWeight:'700',color:C.tx,fontSize:'1rem'},person.full_name));
    pi.appendChild(dv({fontSize:'.75rem',color:C.txT},`${rLabel(person.role)}${person.email?' · '+person.email:''}`));
    hdr.appendChild(pi);
    chatA.appendChild(hdr);

    // Messages area
    const ma=dv({flex:'1',overflowY:'auto',padding:'1.25rem 1.5rem',display:'flex',flexDirection:'column',gap:'.375rem'});
    ma.className='chat-messages';
    chatA.appendChild(ma);

    // Input row
    const ir=dv({padding:'1rem 1.5rem',background:C.surf,borderTop:`1px solid ${C.brd}`,display:'flex',gap:'.625rem',flexShrink:'0',alignItems:'center'});
    const i3=inp({placeholder:'Написать сообщение... (Enter — отправить)'});
    i3.style.flex='1';i3.style.background=C.bg;i3.style.fontSize='.875rem';i3.style.padding='.625rem 1rem';
    chatInputRef=i3;

    const sb2=dv({padding:'9px 20px',background:C.ac,borderRadius:'9px',color:'#fff',cursor:'pointer',display:'flex',alignItems:'center',gap:'6px',fontWeight:'700',fontSize:'.85rem',flexShrink:'0',userSelect:'none'});
    sb2.appendChild(ic('send',15,'#fff'));sb2.appendChild(tx('Отправить'));

    const doSend=async()=>{
      const txt=i3.value.trim();if(!txt)return;
      sb2.style.opacity='0.5';sb2.style.pointerEvents='none';
      const courses=S.courses;
      const cId=courses.find(c=>(c.course_teachers||[]).some(ct=>ct.teacher_id===otherId)||(c.course_managers||[]).some(cm=>cm.manager_id===otherId))?.id||null;
      const{error}=await sb.from('messages').insert({sender_id:S.prof.id,receiver_id:otherId,course_id:cId,content:txt,read:false});
      sb2.style.opacity='1';sb2.style.pointerEvents='auto';
      if(error){toast('Ошибка отправки','err');return;}
      i3.value='';
      await loadMsgs(S.prof);
      refreshConvList();
      renderMessages(otherId);
    };
    sb2.onclick=doSend;
    i3.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();doSend();}});
    ir.appendChild(i3);ir.appendChild(sb2);
    chatA.appendChild(ir);

    renderMessages(otherId);
    setTimeout(()=>i3.focus(),80);
  }

  function renderMessages(otherId){
    const ma=chatA.querySelector('.chat-messages');if(!ma)return;
    const prof=S.prof;const msgs=S.msgs;const allP=S.allP;
    const getP=id=>allP.find(p=>p.id===id)||{full_name:'?',avatar_text:'?',role:'manager'};
    const chatMsgs=msgs.filter(m=>(m.sender_id===prof.id&&m.receiver_id===otherId)||(m.sender_id===otherId&&m.receiver_id===prof.id)).sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));
    ma.innerHTML='';
    if(!chatMsgs.length){ma.appendChild(dv({textAlign:'center',color:C.txT,fontSize:'.82rem',padding:'3rem 1rem'},'Сообщений пока нет — напишите первым'));return;}
    let lastDate='';
    chatMsgs.forEach(m=>{
      const mine=m.sender_id===prof.id;
      const msgDate=new Date(m.created_at).toLocaleDateString('ru-RU',{day:'numeric',month:'long'});
      if(msgDate!==lastDate){
        lastDate=msgDate;
        const sep=dv({textAlign:'center',margin:'.625rem 0',display:'flex',alignItems:'center',gap:'.5rem'});
        sep.appendChild(dv({flex:'1',height:'1px',background:C.brd}));
        sep.appendChild(sp({fontSize:'.7rem',color:C.txT,padding:'2px 10px',background:C.bg,border:`1px solid ${C.brd}`,borderRadius:'999px',whiteSpace:'nowrap'},msgDate));
        sep.appendChild(dv({flex:'1',height:'1px',background:C.brd}));
        ma.appendChild(sep);
      }
      const row=dv({display:'flex',gap:'.5rem',justifyContent:mine?'flex-end':'flex-start',alignItems:'flex-end',marginBottom:'.25rem'});
      if(!mine){const sender=getP(m.sender_id);row.appendChild(av(sender.avatar_text,rColor(sender.role),26));}
      const bc=dv({maxWidth:'65%',minWidth:'80px'});
      const bubble=dv({padding:'.575rem .9rem',background:mine?C.ac:C.surf,border:`1px solid ${mine?C.ac+'66':C.brd}`,borderRadius:mine?'14px 14px 3px 14px':'3px 14px 14px 14px',color:mine?'#fff':C.tx,fontSize:'.875rem',lineHeight:'1.5',boxShadow:C.sh,wordBreak:'break-word'},m.content);
      bc.appendChild(bubble);
      bc.appendChild(dv({fontSize:'.65rem',color:C.txT,marginTop:'3px',textAlign:mine?'right':'left'},fmtT(m.created_at)));
      row.appendChild(bc);
      if(mine){const me=getP(m.sender_id);row.appendChild(av(me.avatar_text||S.prof.avatar_text||'??',C.ac,26));}
      ma.appendChild(row);
    });
    setTimeout(()=>{ma.scrollTop=ma.scrollHeight;},30);
  }

  // RT-обновления без render() — polling каждые 3 сек
  let _ri=null;
  const startLive=()=>{
    if(_ri)clearInterval(_ri);
    _ri=setInterval(async()=>{
      if(!document.getElementById('app'))return;
      const before=S.msgs.length;
      await loadMsgs(S.prof);
      if(S.msgs.length!==before){refreshConvList();if(currentOtherId)renderMessages(currentOtherId);}
    },3000);
  };
  wrap._stop=()=>{if(_ri)clearInterval(_ri);window._msgRefresh=null;};
  window._msgRefresh=()=>{
    loadMsgs(S.prof).then(()=>{refreshConvList();if(currentOtherId)renderMessages(currentOtherId);});
  };
  wrap.appendChild(sideb);
  wrap.appendChild(chatA);
  showEmpty();
  refreshConvList();
  startLive();
  return wrap;
}


function pgCal(){
  let month=new Date();
  const wrap=dv({maxWidth:'1100px'});wrap.className='fade page-pad';

  function build(){
    wrap.innerHTML='';
    const y=month.getFullYear(),mo=month.getMonth();
    const today=new Date();

    // Заголовок
    const navRow=dv({display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.5rem'});
    navRow.appendChild(hx(1,{margin:'0',fontSize:'1.4rem',fontWeight:'800',color:C.tx},'Календарь'));
    const ctrl=dv({display:'flex',alignItems:'center',gap:'.75rem'});
    ctrl.appendChild(btn('←',()=>{month=new Date(y,mo-1);build();},{variant:'secondary',size:'sm'}));
    ctrl.appendChild(sp({fontSize:'1rem',fontWeight:'700',color:C.tx,minWidth:'200px',textAlign:'center',textTransform:'capitalize'},
      month.toLocaleDateString('ru-RU',{month:'long',year:'numeric'})));
    ctrl.appendChild(btn('→',()=>{month=new Date(y,mo+1);build();},{variant:'secondary',size:'sm'}));
    ctrl.appendChild(btn('Сегодня',()=>{month=new Date();build();},{variant:'secondary',size:'sm'}));
    navRow.appendChild(ctrl);
    wrap.appendChild(navRow);

    // Статистика текущего месяца
    const courses=S.courses;
    const allEvents=[];
    courses.forEach(c=>{
      (c.lectures||[]).forEach(l=>{
        try{const d=new Date(l.date);if(d.getFullYear()===y&&d.getMonth()===mo)
          allEvents.push({day:d.getDate(),label:l.topic,sublabel:`${l.time||''} · ${(c.course_teachers||[]).find(ct=>ct.teacher_id===l.teacher_id)?.profiles?.full_name||''}`,color:c.color||C.ac,type:'lecture',course:c.title,cid:c.id,date:l.date,time:l.time||'',link:l.link||''});}catch{}
      });
      (c.tasks||[]).forEach(t=>{
        if(t.deadline&&t.status!=='done'){try{const d=new Date(t.deadline);if(d.getFullYear()===y&&d.getMonth()===mo)
          allEvents.push({day:d.getDate(),label:t.title,sublabel:c.title,color:t.priority==='high'?C.rd:C.yw,type:'task',course:c.title,cid:c.id,date:t.deadline,priority:t.priority,status:t.status});}catch{}}
      });
    });

    // Сетка + боковая панель
    const layout=dv({display:'grid',gridTemplateColumns:'1fr 300px',gap:'1.25rem',alignItems:'start'});

    // Сетка календаря
    const calCard=dv({background:C.surf,border:`1px solid ${C.brd}`,borderRadius:'14px',boxShadow:C.sh,overflow:'hidden'});
    const grid=dv({display:'grid',gridTemplateColumns:'repeat(7,1fr)'});
    ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach((d,i)=>
      grid.appendChild(dv({textAlign:'center',padding:'.625rem .25rem',fontSize:'.7rem',fontWeight:'700',
        color:i>=5?C.ac:C.txS,textTransform:'uppercase',letterSpacing:'.05em',
        borderBottom:`1px solid ${C.brd}`,background:C.bg},d)));

    const fd=(new Date(y,mo,1).getDay()+6)%7;
    const dim=new Date(y,mo+1,0).getDate();
    const dayPanel=dv({});

    // Функция открытия деталей дня
    function showDay(day){
      const dayEvs=allEvents.filter(e=>e.day===day);
      dayPanel.innerHTML='';
      const dayDate=new Date(y,mo,day);
      dayPanel.appendChild(dv({fontWeight:'700',color:C.tx,fontSize:'.9rem',marginBottom:'1rem'},
        dayDate.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long'})));
      if(!dayEvs.length){dayPanel.appendChild(dv({color:C.txT,fontSize:'.82rem'},'Событий нет'));return;}
      dayEvs.forEach(e=>{
        const tab=e.type==='lecture'?'schedule':'tasks';
        const row=dv({padding:'.75rem',background:C.bg,border:`1px solid ${e.color}44`,
          borderLeft:`3px solid ${e.color}`,borderRadius:'8px',marginBottom:'.5rem',
          cursor:e.cid?'pointer':'default',transition:'all .1s'});
        row.onmouseenter=()=>{if(e.cid)row.style.background=C.surfH;};
        row.onmouseleave=()=>{if(e.cid)row.style.background=C.bg;};
        if(e.cid) row.onclick=()=>setS({nav:'course',cid:e.cid,cd:null,activeTab:tab});
        const typeRow=dv({display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'3px'});
        typeRow.appendChild(dv({fontSize:'.72rem',fontWeight:'700',color:e.color,textTransform:'uppercase',letterSpacing:'.04em'},
          e.type==='lecture'?'📅 Лекция':'✅ Задача'));
        if(e.cid) typeRow.appendChild(dv({fontSize:'.68rem',color:C.txT},'→ перейти'));
        row.appendChild(typeRow);
        row.appendChild(dv({fontWeight:'600',color:C.tx,fontSize:'.84rem',marginBottom:'2px'},e.label));
        row.appendChild(dv({fontSize:'.76rem',color:C.txS},e.sublabel));
        if(e.link){const a=document.createElement('a');a.href=e.link;a.target='_blank';
          Object.assign(a.style,{display:'inline-flex',alignItems:'center',gap:'4px',marginTop:'6px',fontSize:'.75rem',color:C.bl,fontWeight:'600'});
          a.appendChild(ic('link',12,C.bl));a.appendChild(tx('Открыть'));row.appendChild(a);}
        dayPanel.appendChild(row);
      });
    }

    // Первоначально показываем события сегодня
    const initDay=y===today.getFullYear()&&mo===today.getMonth()?today.getDate():1;

    [...Array(fd).fill(null),...Array.from({length:dim},(_,i)=>i+1)].forEach((day,i)=>{
      const cell=dv({minHeight:'80px',padding:'5px',
        borderRight:i%7!==6?`1px solid ${C.brd}`:'none',
        borderBottom:`1px solid ${C.brd}`,
        cursor:day?'pointer':'default',
        transition:'background .1s'});
      if(day){
        const isToday=day===today.getDate()&&mo===today.getMonth()&&y===today.getFullYear();
        if(isToday)cell.style.background=C.acL;
        const dayEvs=allEvents.filter(e=>e.day===day);
        const numEl=dv({display:'inline-flex',alignItems:'center',justifyContent:'center',
          width:'24px',height:'24px',borderRadius:'50%',
          background:isToday?C.ac:'transparent',
          color:isToday?'#fff':C.txS,
          fontSize:'.8rem',fontWeight:isToday?'800':'500',marginBottom:'3px'
        },String(day));
        cell.appendChild(numEl);
        dayEvs.slice(0,3).forEach(e=>{
          const ev=dv({fontSize:'.65rem',padding:'2px 5px',borderRadius:'4px',
            background:e.color+'22',color:e.color,marginBottom:'2px',
            overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap',
            fontWeight:'600',border:`1px solid ${e.color}33`},e.label);
          ev.title=e.label;
          cell.appendChild(ev);
        });
        if(dayEvs.length>3)cell.appendChild(dv({fontSize:'.63rem',color:C.txT},`+${dayEvs.length-3} ещё`));
        cell.onclick=()=>{
          Array.from(grid.querySelectorAll('[data-day]')).forEach(c2=>c2.style.outline='none');
          cell.style.outline=`2px solid ${C.ac}`;cell.style.outlineOffset='-2px';
          showDay(day);
        };
        cell.dataset.day=day;
        cell.onmouseenter=()=>{if(!isToday)cell.style.background=C.surfH;};
        cell.onmouseleave=()=>{if(!isToday)cell.style.background='transparent';};
      }
      grid.appendChild(cell);
    });
    calCard.appendChild(grid);
    layout.appendChild(calCard);

    // Боковая панель
    const side=document.createElement('div');side.className='cal-side-col';Object.assign(side.style,{display:'flex',flexDirection:'column',gap:'.75rem'});

    // Легенда курсов
    if(courses.length){
      const legend=dv({background:C.surf,border:`1px solid ${C.brd}`,borderRadius:'12px',padding:'1rem'});
      legend.appendChild(dv({fontWeight:'700',color:C.tx,fontSize:'.82rem',marginBottom:'.75rem'},'Курсы'));
      courses.forEach(c=>{
        const lRow=dv({display:'flex',alignItems:'center',gap:'.6rem',marginBottom:'.4rem'});
        lRow.appendChild(dv({width:'10px',height:'10px',borderRadius:'50%',background:c.color||C.ac,flexShrink:'0'}));
        lRow.appendChild(dv({fontSize:'.8rem',color:C.tx,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'},c.title));
        const cnt=allEvents.filter(e=>e.course===c.title).length;
        if(cnt>0)lRow.appendChild(sp({fontSize:'.7rem',color:C.txT,marginLeft:'auto',flexShrink:'0'},`${cnt} соб.`));
        legend.appendChild(lRow);
      });
      side.appendChild(legend);
    }

    // Детали выбранного дня
    const detailCard=dv({background:C.surf,border:`1px solid ${C.brd}`,borderRadius:'12px',padding:'1rem'});
    detailCard.appendChild(dv({fontWeight:'700',color:C.tx,fontSize:'.82rem',marginBottom:'.75rem'},'События дня'));
    detailCard.appendChild(dayPanel);
    side.appendChild(detailCard);

    // Статистика месяца
    const statCard=dv({background:C.surf,border:`1px solid ${C.brd}`,borderRadius:'12px',padding:'1rem'});
    statCard.appendChild(dv({fontWeight:'700',color:C.tx,fontSize:'.82rem',marginBottom:'.75rem'},'Месяц'));
    const lecs=allEvents.filter(e=>e.type==='lecture').length;
    const tasks=allEvents.filter(e=>e.type==='task').length;
    [[`${lecs} лекций`,C.bl],[`${tasks} дедлайнов`,C.rd]].forEach(([l,c2])=>{
      const row=dv({display:'flex',alignItems:'center',gap:'.5rem',marginBottom:'.4rem'});
      row.appendChild(dv({width:'8px',height:'8px',borderRadius:'50%',background:c2}));
      row.appendChild(sp({fontSize:'.8rem',color:C.tx},l));
      statCard.appendChild(row);
    });
    side.appendChild(statCard);
    layout.appendChild(side);
    wrap.appendChild(layout);

    showDay(initDay);
  }
  build();return wrap;
}

    if(!items.length) return;
    wrap.appendChild(dv({fontSize:'.8rem',fontWeight:'700',color:C.txS,textTransform:'uppercase',letterSpacing:'.05em',marginBottom:'.5rem',marginTop:'1.25rem'},label+` (${items.length})`));
    items.sort((a,b)=>new Date(a.deadline||'9999')-new Date(b.deadline||'9999')).forEach(t=>{
      const dd=daysUntil(t.deadline);
      const overdue=dd<0&&t.status!=='done';
      const row=dv({display:'flex',gap:'1rem',padding:'.875rem 1.25rem',background:C.surf,
        border:`1px solid ${overdue?C.rdB:C.brd}`,borderRadius:'10px',marginBottom:'.5rem',
        alignItems:'center',boxShadow:C.sh});
      row.appendChild(dv({width:'8px',height:'8px',borderRadius:'50%',flexShrink:'0',
        background:{high:C.rd,medium:C.yw,low:C.txT}[t.priority]||C.txT}));
      const inf=dv({flex:'1'});
      inf.appendChild(dv({fontWeight:'600',color:C.tx,fontSize:'.875rem'},t.title));
      const ctag=dv({display:'flex',alignItems:'center',gap:'6px',marginTop:'3px'});
      ctag.appendChild(dv({width:'8px',height:'8px',borderRadius:'50%',background:t.cCol}));
      ctag.appendChild(sp({fontSize:'.76rem',color:C.txS},t.cName));
      if(t.deadline) ctag.appendChild(sp({fontSize:'.76rem',color:overdue?C.rd:C.txS,fontWeight:overdue?'700':'400'},
        overdue?`Просрочено ${Math.abs(dd)}д`:dd===0?'Сегодня':'до '+fmtS(t.deadline)));
      inf.appendChild(ctag);
      row.appendChild(inf);
      // Status move buttons
      if(status!=='done'){
        row.appendChild(btn(status==='todo'?'В работу':'Готово',async()=>{
          const newS=status==='todo'?'in-progress':'done';
          await sb.from('tasks').update({status:newS}).eq('id',t.id);
          await loadCourses(prof);render();
        },{variant:status==='todo'?'secondary':'green',size:'sm'}));
      }
      wrap.appendChild(row);
    });
  });
  return wrap;
}

// ─── LOAD ASSIGNMENTS FOR COURSE ──────────────────────────────
async function loadAssignments(courseId){
  const{data}=await sb.from('assignments').select(`
    *,
    submissions(*,profiles!submissions_student_id_fkey(id,full_name,avatar_text))
  `).eq('course_id',courseId).order('created_at',{ascending:false});
  return data||[];
}

// ─── TEACHER: TAB ASSIGNMENTS ─────────────────────────────────
async function tabAssignments(course,prof,reload){
  const wrap=dv({});
  const assignments=await loadAssignments(course.id);

  // Header
  const hdr=dv({display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1.25rem',flexWrap:'wrap',gap:'.75rem'});
  hdr.appendChild(hx(3,{margin:'0',fontSize:'1rem',fontWeight:'800',color:C.tx},'Задания и тесты'));
  if(prof.role==='manager'||prof.role==='teacher'){
    const btnRow=dv({display:'flex',gap:'.5rem'});
    btnRow.appendChild(btn('+ Задание',()=>modalCreateAssignment(course,'homework',reload),{variant:'secondary',size:'sm'}));
    btnRow.appendChild(btn('+ Тест',()=>modalCreateAssignment(course,'test',reload),{variant:'primary',size:'sm'}));
    hdr.appendChild(btnRow);
  }
  wrap.appendChild(hdr);

  if(!assignments.length){wrap.appendChild(empty('Нет заданий. Нажмите «+ Задание» или «+ Тест»'));return wrap;}

  // Group by type
  const hw=assignments.filter(a=>a.type==='homework');
  const ts=assignments.filter(a=>a.type==='test');

  [[hw,'📝 Домашние задания'],[ts,'📊 Тесты']].forEach(([list,title])=>{
    if(!list.length) return;
    wrap.appendChild(sp({fontSize:'.78rem',fontWeight:'700',color:C.txS,textTransform:'uppercase',
      letterSpacing:'.05em',display:'block',marginBottom:'.625rem',marginTop:'1.25rem'},title));
    list.forEach(a=>{
      const due=daysUntil(a.due_date);
      const subs=a.submissions||[];
      const students=course.students||[];
      const submitted=subs.length;
      const graded=subs.filter(s=>s.grade!=null).length;
      const card2=card(null);card2.style.marginBottom='.625rem';

      const row=dv({display:'flex',gap:'1rem',alignItems:'flex-start',flexWrap:'wrap'});

      // Left: info
      const inf=dv({flex:'1',minWidth:'200px'});
      const titleRow=dv({display:'flex',alignItems:'center',gap:'.5rem',marginBottom:'.25rem'});
      titleRow.appendChild(sp({fontWeight:'700',color:C.tx,fontSize:'.9rem'},a.title));
      if(a.type==='test') titleRow.appendChild(badge('Тест','blue',true));
      titleRow.appendChild(badge(due<0?'Просрочено':due===0?'Сегодня':`${due} дн.`,due<0?'red':due<=2?'yellow':'green',true));
      inf.appendChild(titleRow);
      if(a.description) inf.appendChild(sp({fontSize:'.8rem',color:C.txS,display:'block',marginBottom:'.375rem'},a.description));

      // Stats row
      const stats=dv({display:'flex',gap:'.75rem',flexWrap:'wrap'});
      [{l:'Сдали',v:`${submitted}/${students.length}`,c:C.bl},{l:'Проверено',v:`${graded}/${submitted}`,c:C.gr}].forEach(({l,v,c})=>{
        const s=dv({fontSize:'.76rem',color:C.txS});
        s.appendChild(sp({fontWeight:'700',color:c,marginRight:'3px'},v));
        s.appendChild(tx(l));
        stats.appendChild(s);
      });
      if(a.max_score) stats.appendChild(dv({fontSize:'.76rem',color:C.txS},`Макс. балл: ${a.max_score}`));
      inf.appendChild(stats);
      row.appendChild(inf);

      // Right: actions
      const acts=dv({display:'flex',gap:'.5rem',alignItems:'center',flexShrink:'0'});
      acts.appendChild(btn('Ответы',()=>modalViewSubmissions(a,course,reload),{variant:'secondary',size:'sm'}));
      if(prof.role==='manager'||prof.role==='teacher'){
        acts.appendChild(ibtn('edit',()=>modalEditAssignment(a,course,reload),'Редактировать',C.bl));
        acts.appendChild(ibtn('trash',async()=>{
          if(!confirm('Удалить задание?'))return;
          await sb.from('assignments').delete().eq('id',a.id);
          reload();
        },'Удалить',C.rd));
      }
      row.appendChild(acts);
      card2.appendChild(row);
      wrap.appendChild(card2);
    });
  });
  return wrap;
}

// ─── STUDENT: ASSIGNMENTS PAGE ────────────────────────────────
async function pgSAssignments(){
  const{courses,prof}=S;
  const wrap=dv({maxWidth:'760px'});wrap.className='fade page';
  wrap.appendChild(hx(1,{margin:'0 0 1.5rem',fontSize:'1.4rem',fontWeight:'800',color:C.tx},'Мои задания 📝'));

  if(!courses.length){wrap.appendChild(empty('Нет курса'));return wrap;}
  const course=courses[0];
  const assignments=await loadAssignments(course.id);

  if(!assignments.length){wrap.appendChild(dv({textAlign:'center',padding:'3rem 1rem',color:C.txS},'Преподаватель ещё не добавил заданий'));return wrap;}

  // Filter tabs
  let filter='pending';
  const allSubs=assignments.flatMap(a=>(a.submissions||[]).filter(s=>s.student_id===prof.id));
  const pending=assignments.filter(a=>!(a.submissions||[]).some(s=>s.student_id===prof.id));
  const done=assignments.filter(a=>(a.submissions||[]).some(s=>s.student_id===prof.id));

  const tabBar=dv({display:'flex',gap:'5px',marginBottom:'1.5rem',background:C.surf,border:`1px solid ${C.brd}`,borderRadius:'12px',padding:'4px'});
  const tabList=dv({});

  const mkTab=(id,lbl,cnt)=>{
    const b=dv({padding:'.4rem .875rem',borderRadius:'8px',cursor:'pointer',fontSize:'.82rem',fontWeight:'700',transition:'all .1s',
      background:filter===id?C.ac:'transparent',color:filter===id?'#fff':C.txS,whiteSpace:'nowrap'});
    b.textContent=lbl+(cnt?` (${cnt})`:'');
    b.onclick=()=>{filter=id;tabBar.querySelectorAll('div').forEach((el,i)=>{const ids=['pending','done'];el.style.background=ids[i]===id?C.ac:'transparent';el.style.color=ids[i]===id?'#fff':C.txS;});buildStudentList();};
    return b;
  };
  tabBar.appendChild(mkTab('pending','Не сдано',pending.length));
  tabBar.appendChild(mkTab('done','Сдано',done.length));
  wrap.appendChild(tabBar);
  wrap.appendChild(tabList);

  function buildStudentList(){
    tabList.innerHTML='';
    const list=filter==='pending'?pending:done;
    if(!list.length){tabList.appendChild(dv({textAlign:'center',padding:'2rem',color:C.txS},filter==='pending'?'Все задания сданы! 🎉':'Нет сданных заданий'));return;}

    list.forEach(a=>{
      const sub=(a.submissions||[]).find(s=>s.student_id===prof.id);
      const due=daysUntil(a.due_date);
      const c2=card(null);c2.style.marginBottom='.75rem';

      const top=dv({display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'1rem',marginBottom:'.625rem'});
      const ti=dv({flex:'1'});
      const tr=dv({display:'flex',alignItems:'center',gap:'.5rem',marginBottom:'.25rem',flexWrap:'wrap'});
      tr.appendChild(sp({fontWeight:'700',color:C.tx,fontSize:'.95rem'},a.title));
      if(a.type==='test') tr.appendChild(badge('Тест','blue',true));
      if(sub?.grade!=null) tr.appendChild(badge(`${sub.grade}/${a.max_score||'?'} б`,'green',true));
      ti.appendChild(tr);
      if(a.description) ti.appendChild(sp({fontSize:'.82rem',color:C.txS,display:'block',marginBottom:'.25rem'},a.description));
      if(a.due_date) ti.appendChild(sp({fontSize:'.76rem',color:due<0?C.rd:C.txT},`Дедлайн: ${fmt(a.due_date)}`));
      top.appendChild(ti);

      if(!sub){
        const submitBtn=btn(a.type==='test'?'Пройти тест':'Сдать задание',()=>{
          if(a.type==='test') modalTakeTest(a,prof,()=>render());
          else modalSubmitHomework(a,prof,()=>render());
        },{variant:'primary',size:'sm'});
        top.appendChild(submitBtn);
      } else {
        top.appendChild(badge(sub.grade!=null?'Проверено':'На проверке',sub.grade!=null?'green':'yellow',false));
      }
      c2.appendChild(top);

      // If submitted: show answer summary
      if(sub){
        const ansBox=dv({background:C.bg,borderRadius:'8px',padding:'.625rem .875rem',fontSize:'.82rem',color:C.txS});
        if(a.type==='test'&&sub.answers){
          try{
            const ans=JSON.parse(sub.answers);
            const qs=a.questions?JSON.parse(a.questions):[];
            let correct=0;
            qs.forEach((q,i)=>{if(ans[i]===q.correct) correct++;});
            ansBox.appendChild(sp({color:C.tx,fontWeight:'600'},`Правильных ответов: ${correct}/${qs.length}`));
          }catch{}
        } else if(sub.text_answer){
          ansBox.appendChild(sp({color:C.txS},`Ответ: ${sub.text_answer.slice(0,120)}${sub.text_answer.length>120?'...':''}`));
        }
        if(sub.teacher_comment) ansBox.appendChild(dv({marginTop:'.375rem',color:C.gr,fontWeight:'600'},`Комментарий: ${sub.teacher_comment}`));
        c2.appendChild(ansBox);
      }
      tabList.appendChild(c2);
    });
  }
  buildStudentList();
  return wrap;
}

// ─── MODAL: CREATE ASSIGNMENT ─────────────────────────────────
function modalCreateAssignment(course,type,reload){
  let title='',desc='',due='',maxScore=type==='test'?100:10;
  let questions=[{text:'',options:['','','',''],correct:0}];

  const qWrap=dv({});
  const rebuildQ=()=>{
    qWrap.innerHTML='';
    if(type!=='test') return;
    questions.forEach((q,qi)=>{
      const qCard=dv({background:C.bg,border:`1px solid ${C.brd}`,borderRadius:'10px',padding:'.875rem',marginBottom:'.75rem'});
      qCard.appendChild(sp({fontSize:'.76rem',fontWeight:'700',color:C.txT,display:'block',marginBottom:'.375rem'},`Вопрос ${qi+1}`));
      const qtInp=inp({value:q.text,placeholder:'Текст вопроса...',onInput:v=>{questions[qi].text=v;}});
      qCard.appendChild(fld('',qtInp));
      q.options.forEach((opt,oi)=>{
        const oRow=dv({display:'flex',gap:'.5rem',alignItems:'center',marginTop:'.375rem'});
        const rb=document.createElement('input');rb.type='radio';rb.name=`q${qi}`;rb.checked=q.correct===oi;
        rb.onchange=()=>{questions[qi].correct=oi;};
        rb.style.cssText='width:16px;height:16px;accent-color:'+C.ac+';flex-shrink:0';
        oRow.appendChild(rb);
        const oi2=inp({value:opt,placeholder:`Вариант ${oi+1}`,onInput:v=>{questions[qi].options[oi]=v;}});
        oRow.appendChild(oi2);
        qCard.appendChild(oRow);
      });
      if(questions.length>1) qCard.appendChild(dv({display:'flex',justifyContent:'flex-end',marginTop:'.5rem'},
        btn('Удалить вопрос',()=>{questions.splice(qi,1);rebuildQ();},{variant:'secondary',size:'sm'})));
      qWrap.appendChild(qCard);
    });
    qWrap.appendChild(btn('+ Добавить вопрос',()=>{questions.push({text:'',options:['','','',''],correct:0});rebuildQ();},{variant:'secondary',size:'sm',full:true}));
  };

  const fields=[
    fld('Название',inp({placeholder:type==='test'?'Тест по теме 1':'Домашнее задание №1',onInput:v=>title=v})),
    fld('Описание / условие',tarea({placeholder:'Подробное описание задания...',onInput:v=>desc=v,rows:3})),
    dv({display:'grid',gridTemplateColumns:'1fr 1fr',gap:'1rem'},
      fld('Дедлайн',inp({type:'date',onInput:v=>due=v})),
      fld('Макс. балл',inp({type:'number',value:String(maxScore),onInput:v=>maxScore=Number(v)||10}))),
  ];
  if(type==='test'){
    fields.push(dv({marginTop:'.25rem'},sp({fontSize:'.82rem',fontWeight:'700',color:C.tx,display:'block',marginBottom:'.75rem'},'Вопросы теста:')));
    rebuildQ();
    fields.push(qWrap);
  }
  fields.push(dv({display:'flex',justifyContent:'flex-end',gap:'.75rem',marginTop:'.5rem'},
    btn('Отмена',()=>m.remove(),{variant:'secondary'}),
    btn('Создать',async()=>{
      if(!title.trim()){toast('Введите название','err');return;}
      const ins={course_id:course.id,type,title,description:desc||null,due_date:due||null,max_score:maxScore,created_by:S.prof.id};
      if(type==='test') ins.questions=JSON.stringify(questions);
      const{error}=await sb.from('assignments').insert(ins);
      if(error){toast('Ошибка: '+error.message,'err');return;}
      toast(type==='test'?'Тест создан':'Задание создано');m.remove();reload();
    },{variant:'primary'})
  ));
  const m=modal(type==='test'?'Новый тест':'Новое задание',fields,()=>m.remove(),true);
  document.body.appendChild(m);
}

// ─── MODAL: VIEW SUBMISSIONS (teacher) ────────────────────────
function modalViewSubmissions(assignment,course,reload){
  const subs=assignment.submissions||[];
  const students=course.students||[];
  const qs=assignment.type==='test'&&assignment.questions?JSON.parse(assignment.questions):[];

  const rows=students.map(st=>{
    const sub=subs.find(s=>s.student_id===st.id)||null;
    return {st,sub};
  });

  const content=dv({maxHeight:'60vh',overflow:'auto'});
  if(!rows.length){content.appendChild(empty('Нет слушателей'));} else {
    rows.forEach(({st,sub})=>{
      const row=dv({display:'flex',gap:'1rem',alignItems:'flex-start',padding:'.75rem',borderBottom:`1px solid ${C.brd}`,flexWrap:'wrap'});
      row.appendChild(av(ini(st.full_name),C.bl,34));
      const inf=dv({flex:'1',minWidth:'160px'});
      inf.appendChild(sp({fontWeight:'700',fontSize:'.875rem',color:C.tx,display:'block'},st.full_name));
      if(!sub){
        inf.appendChild(badge('Не сдано','red',true));
      } else {
        inf.appendChild(badge('Сдано','green',true));
        if(assignment.type==='test'&&sub.answers){
          try{
            const ans=JSON.parse(sub.answers);
            let correct=0;qs.forEach((q,i)=>{if(ans[i]===q.correct)correct++;});
            inf.appendChild(sp({fontSize:'.8rem',color:C.txS,display:'block',marginTop:'3px'},`Результат: ${correct}/${qs.length} правильных`));
          }catch{}
        } else if(sub.text_answer){
          inf.appendChild(sp({fontSize:'.8rem',color:C.txS,display:'block',marginTop:'3px',wordBreak:'break-word'},`Ответ: ${sub.text_answer.slice(0,100)}...`));
        }
        if(sub.teacher_comment) inf.appendChild(sp({fontSize:'.8rem',color:C.gr,display:'block',marginTop:'2px'},`Комментарий: ${sub.teacher_comment}`));
      }
      inf.appendChild(dv({display:'flex',gap:'.5rem',marginTop:'.5rem',flexWrap:'wrap'},
        sub?btn('Поставить оценку',()=>modalGrade(sub,assignment,reload2),{variant:'secondary',size:'sm'}):dv({})
      ));
      function reload2(){m.remove();modalViewSubmissions(assignment,course,reload);}
      row.appendChild(inf);
      content.appendChild(row);
    });
  }

  const m=modal(`Ответы: ${assignment.title}`,[content],()=>m.remove(),true);
  document.body.appendChild(m);
}

      },{variant:'primary'}))

// ─── MODAL: SUBMIT HOMEWORK (student) ─────────────────────────
function modalSubmitHomework(assignment,studentObj,prof,reload){
  let text='';
  const m=modal(`Сдать: ${assignment.title}`,[
    assignment.description?dv({background:C.bg,borderRadius:'10px',padding:'.875rem',marginBottom:'.25rem',fontSize:'.85rem',color:C.txS},assignment.description):dv({}),

      },{variant:'primary'}))

// ─── MODAL: TAKE TEST (student) ───────────────────────────────
function modalTakeTest(assignment,prof,reload){
  let qs=[];
  try{qs=JSON.parse(assignment.questions||'[]');}catch{qs=[];}
  const answers={};

  const qsWrap=dv({});
  qs.forEach((q,qi)=>{
    const qBlock=dv({background:C.bg,border:`1px solid ${C.brd}`,borderRadius:'12px',padding:'1rem',marginBottom:'.875rem'});
    qBlock.appendChild(sp({fontWeight:'700',color:C.tx,display:'block',marginBottom:'.75rem',fontSize:'.9rem'},`${qi+1}. ${q.text}`));
    q.options.forEach((opt,oi)=>{
      if(!opt.trim()) return;
      const oRow=dv({display:'flex',alignItems:'center',gap:'.75rem',padding:'.5rem .75rem',borderRadius:'8px',cursor:'pointer',
        border:'1.5px solid transparent',transition:'all .1s',marginBottom:'.25rem'});
      const rb=document.createElement('input');rb.type='radio';rb.name=`tq${qi}`;
      rb.style.cssText='width:18px;height:18px;accent-color:'+C.ac+';flex-shrink:0;cursor:pointer';
      rb.onchange=()=>{
        answers[qi]=oi;
        qBlock.querySelectorAll('.opt-row').forEach(r=>r.style.background='transparent');
        oRow.style.background=C.acL;oRow.style.borderColor=C.acB;
      };
      oRow.className='opt-row';
      oRow.onclick=()=>rb.click();
      oRow.appendChild(rb);
      oRow.appendChild(sp({fontSize:'.875rem',color:C.tx},opt));
      qBlock.appendChild(oRow);
    });
    qsWrap.appendChild(qBlock);
  });

  const footer=dv({display:'flex',justifyContent:'space-between',alignItems:'center',gap:'.75rem',flexWrap:'wrap'});
  const counter=sp({fontSize:'.82rem',color:C.txS},'');
  const updateCounter=()=>{counter.textContent=`Отвечено: ${Object.keys(answers).length}/${qs.length}`;};
  updateCounter();
  // Update counter on any answer
  qsWrap.addEventListener('change',updateCounter);
  footer.appendChild(counter);
  footer.appendChild(dv({display:'flex',gap:'.75rem'},
    btn('Отмена',()=>m.remove(),{variant:'secondary'}),
    btn('Отправить тест',async()=>{
      if(Object.keys(answers).length<qs.length){if(!confirm(`Вы ответили на ${Object.keys(answers).length} из ${qs.length} вопросов. Отправить?`))return;}
      const st=S.courses[0]?.students?.find(s=>s.email===prof.email);
      if(!st){toast('Не найден профиль слушателя','err');return;}
      // Auto-grade test
      let correct=0;qs.forEach((q,i)=>{if(answers[i]===q.correct)correct++;});
      const pct=Math.round((correct/qs.length)*100);
      const grade=Math.round((correct/qs.length)*(assignment.max_score||100));
      const{error}=await sb.from('submissions').insert({
        assignment_id:assignment.id,student_id:st.id,
        answers:JSON.stringify(answers),grade,
        teacher_comment:`Автопроверка: ${correct}/${qs.length} правильных (${pct}%)`
      });
      if(error){toast('Ошибка: '+error.message,'err');return;}
      toast(`Тест сдан! Результат: ${correct}/${qs.length} (${grade} баллов)`);
      m.remove();reload();
    },{variant:'primary'})
  ));

  const m=modal(`📊 ${assignment.title}`,[
    assignment.description?dv({background:C.acL,borderRadius:'10px',padding:'.75rem',marginBottom:'.5rem',fontSize:'.84rem',color:C.txS},assignment.description):dv({}),
    qsWrap,footer
  ],()=>m.remove(),true);
  document.body.appendChild(m);
}


// ─── TEACHER ASSIGNMENTS PAGE ────────────────────────────────
async function pgTHW(){

  if(!courses.length){wrap.appendChild(empty('Нет курсов'));return wrap;}

  for(const course of courses){
    const assignments=await loadAssignments(course.id);
    const sec=dv({marginBottom:'2rem'});

    // Course header
    const ch=dv({display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'1rem',flexWrap:'wrap',gap:'.5rem'});

    ct.appendChild(dv({width:'10px',height:'10px',borderRadius:'50%',background:course.color||'#C17A3E',flexShrink:'0'}));
    ct.appendChild(sp({fontWeight:'800',color:C.tx,fontSize:'1rem'},course.title));
    ch.appendChild(ct);
    const btnRow=dv({display:'flex',gap:'.5rem'});
    btnRow.appendChild(btn('+ Задание',()=>modalCreateAssignment(course,'homework',()=>{render();}),{variant:'secondary',size:'sm'}));
    btnRow.appendChild(btn('+ Тест',()=>modalCreateAssignment(course,'test',()=>{render();}),{variant:'primary',size:'sm'}));

      sec.appendChild(aNode);

// ─── STUDENT ASSIGNMENTS PAGE ────────────────────────────────
async function pgSHW(){
  const{courses,prof}=S;
  const wrap=dv({maxWidth:'760px'});wrap.className='fade page';
  wrap.appendChild(hx(1,{margin:'0 0 1.25rem',fontSize:'1.4rem',fontWeight:'800',color:C.tx},'Мои задания 📝'));

  if(!courses.length){wrap.appendChild(empty('Нет курса'));return wrap;}
  const course=courses[0];
  const assignments=await loadAssignments(course.id);
  const student=course.students?.find(s=>s.email===prof.email)||null;

  if(!assignments.length){
    const em=dv({textAlign:'center',padding:'3rem 1rem'});
    em.appendChild(ic('doc',48,C.txT));
    em.appendChild(dv({fontWeight:'700',color:C.tx,marginTop:'1rem',fontSize:'1rem'},'Нет заданий'));
    em.appendChild(dv({color:C.txS,fontSize:'.875rem',marginTop:'.375rem'},'Преподаватель ещё не добавил заданий'));
    wrap.appendChild(em);
    return wrap;
  }

  // Stats bar
  const allSubs=assignments.flatMap(a=>(a.submissions||[]).filter(s=>student&&s.student_id===student.id));
  const total=assignments.length;
  const submitted=assignments.filter(a=>(a.submissions||[]).some(s=>student&&s.student_id===student.id)).length;
  const graded=allSubs.filter(s=>s.grade!=null).length;

  const statsRow=document.createElement('div');statsRow.className='grid-3';statsRow.style.marginBottom='1.5rem';
  [['Всего',total,C.bl],['Сдано',submitted,C.gr],['Проверено',graded,C.ac]].forEach(([l,v,c])=>{
    const sc=card(null);sc.style.padding='1rem';sc.style.textAlign='center';
    sc.appendChild(sp({fontSize:'1.5rem',fontWeight:'800',color:c,display:'block'},String(v)));
    sc.appendChild(sp({fontSize:'.76rem',color:C.txS,fontWeight:'600'},l));
    statsRow.appendChild(sc);
  });
  wrap.appendChild(statsRow);

  // Filter tabs
  let filter='pending';
  const tabBar2=document.createElement('div');tabBar2.className='tab-bar';tabBar2.style.marginBottom='1.25rem';
  const taskList=dv({});
  wrap.appendChild(tabBar2);wrap.appendChild(taskList);

  const mkFTab=(id,lbl)=>{
    const b=document.createElement('button');b.className='tab-btn'+(filter===id?' on':'');
    b.textContent=lbl;
    b.onclick=()=>{filter=id;tabBar2.querySelectorAll('button').forEach(btn2=>btn2.className='tab-btn'+(btn2===b?' on':''));buildHWList();};
    tabBar2.appendChild(b);
  };
  mkFTab('pending','⏳ Не сдано');mkFTab('submitted','✅ Сдано');mkFTab('all','Все');

  function buildHWList(){
    taskList.innerHTML='';
    const list=assignments.filter(a=>{
      const sub=(a.submissions||[]).find(s=>student&&s.student_id===student.id);
      if(filter==='pending') return !sub;
      if(filter==='submitted') return !!sub;
      return true;
    });
    if(!list.length){taskList.appendChild(dv({textAlign:'center',padding:'2rem',color:C.txS},filter==='pending'?'🎉 Все задания сданы!':'Нет заданий'));return;}

    list.forEach(a=>{
      const sub=(a.submissions||[]).find(s=>student&&s.student_id===student.id);
      const due=daysUntil(a.due_date);
      const overdue=due<0&&!sub;
      const c2=card(null);c2.style.marginBottom='.75rem';

      // Top row
      const top=dv({display:'flex',justifyContent:'space-between',alignItems:'flex-start',gap:'1rem',marginBottom:'.625rem',flexWrap:'wrap'});
      const ti=dv({flex:'1',minWidth:'160px'});
      const tr=dv({display:'flex',alignItems:'center',gap:'.5rem',marginBottom:'.25rem',flexWrap:'wrap'});
      tr.appendChild(sp({fontWeight:'700',color:C.tx,fontSize:'.95rem'},a.title));
      tr.appendChild(badge(a.type==='test'?'Тест':'Задание',a.type==='test'?'blue':'green',true));
      if(sub?.grade!=null) tr.appendChild(badge(`${sub.grade}/${a.max_score||'?'} б`,'amber',true));
      ti.appendChild(tr);
      if(a.description) ti.appendChild(sp({fontSize:'.82rem',color:C.txS,display:'block',marginBottom:'.25rem'},a.description.slice(0,100)+(a.description.length>100?'...':'')));
      const meta=dv({display:'flex',gap:'.75rem',flexWrap:'wrap'});
      if(a.due_date) meta.appendChild(sp({fontSize:'.76rem',color:overdue?C.rd:C.txT,fontWeight:overdue?'700':'400'},(overdue?'⚠️ Просрочено: ':'Дедлайн: ')+fmt(a.due_date)));
      if(a.max_score) meta.appendChild(sp({fontSize:'.76rem',color:C.txT},`Макс: ${a.max_score} б`));
      ti.appendChild(meta);
      top.appendChild(ti);

      if(!sub){
        const actBtn=btn(a.type==='test'?'▶ Пройти тест':'📤 Сдать задание',()=>{
          if(a.type==='test') modalTakeTest(a,prof,()=>render());
          else modalSubmitHomework(a,student,prof,()=>render());
        },{variant:a.type==='test'?'primary':'secondary',size:'sm'});
        top.appendChild(actBtn);
      } else {
        const statusBadge=dv({flexShrink:'0'});
        statusBadge.appendChild(sub.grade!=null?badge('Проверено ✓','green'):badge('На проверке','yellow'));
        top.appendChild(statusBadge);
      }
      c2.appendChild(top);

      // Submitted answer preview
      if(sub){
        const box=dv({background:C.bg,borderRadius:'8px',padding:'.625rem .875rem',fontSize:'.82rem'});
        if(a.type==='test'&&sub.answers){
          try{
            const ans=JSON.parse(sub.answers);const qs=JSON.parse(a.questions||'[]');
            let correct=0;qs.forEach((q,i)=>{if(ans[i]===q.correct)correct++;});
            box.appendChild(sp({color:C.tx,fontWeight:'600'},`Результат: ${correct}/${qs.length} правильных ответов`));
          }catch{}
        } else if(sub.text_answer){
          box.appendChild(sp({color:C.txS},`Ваш ответ: ${sub.text_answer.slice(0,120)}${sub.text_answer.length>120?'...':''}`));
        }
        if(sub.teacher_comment) box.appendChild(dv({marginTop:'.375rem',color:C.gr,fontWeight:'600'},`💬 ${sub.teacher_comment}`));
        c2.appendChild(box);
      }
      taskList.appendChild(c2);
    });
  }
  buildHWList();
  return wrap;
}

// ─── THEME ───────────────────────────────────────────────
function getTheme(){return localStorage.getItem('eduflow_theme')||'light';}
function setTheme(t){
  localStorage.setItem('eduflow_theme',t);
  document.documentElement.setAttribute('data-theme',t);
}
// Apply theme on load
setTheme(getTheme());

// ─── PROFILE MODAL ───────────────────────────────────────
function modalProfile(){
  const p=S.prof;
  let name=p.full_name||'',phone=p.phone||'',subj=p.subject||'';
  let theme=getTheme();

  const themeRow=dv({display:'flex',gap:'.5rem',marginTop:'.25rem'});
  [{v:'light',lbl:'☀️ Светлая'},{v:'dark',lbl:'🌙 Тёмная'}].forEach(({v,lbl})=>{
    const b=dv({flex:'1',padding:'.625rem',borderRadius:'10px',textAlign:'center',cursor:'pointer',
      fontSize:'.84rem',fontWeight:'700',transition:'all .15s',
      border:`2px solid ${theme===v?C.ac:C.brd}`,
      background:theme===v?C.acL:C.surf,
      color:theme===v?C.ac:C.txS});
    b.textContent=lbl;
    b.onclick=()=>{
      theme=v;setTheme(v);
      themeRow.querySelectorAll('div').forEach((el,i)=>{
        const tv=i===0?'light':'dark';
        el.style.border=`2px solid ${tv===v?C.ac:C.brd}`;
        el.style.background=tv===v?C.acL:C.surf;
        el.style.color=tv===v?C.ac:C.txS;
      });
    };
    themeRow.appendChild(b);
  });

  const nameInp=inp({value:name,placeholder:'Иванов Иван Иванович',onInput:v=>name=v});
  const phoneInp=inp({value:phone,placeholder:'+7 (999) 000-00-00',onInput:v=>phone=v});
  const subjInp=inp({value:subj,placeholder:'Математика, физика...',onInput:v=>subj=v});

  const content=[
    dv({display:'flex',alignItems:'center',gap:'1rem',padding:'1rem 1.5rem',
      background:C.acL,borderRadius:'12px',marginBottom:'1.25rem'},
      av(p.avatar_text||'??',rColor(p.role),48),
      dv({},
        dv({fontWeight:'800',fontSize:'1.05rem',color:C.tx},p.full_name||'—'),
        dv({fontSize:'.8rem',color:C.txS,marginTop:'2px'},p.email||''),
        badge(rLabel(p.role),p.role==='manager'?'amber':p.role==='teacher'?'blue':'green')
      )
    ),
    fld('Полное имя',nameInp),
    fld('Телефон',phoneInp),
    p.role==='teacher'?fld('Дисциплина',subjInp):dv({}),
    fld('Тема оформления',themeRow),
    dv({display:'flex',justifyContent:'flex-end',gap:'.75rem',marginTop:'.5rem'},
      btn('Отмена',()=>m.remove(),{variant:'secondary'}),
      btn('Сохранить',async()=>{
        if(!name.trim()){toast('Введите имя','err');return;}
        const upd={full_name:name,phone:phone,avatar_text:ini(name)};
        if(p.role==='teacher') upd.subject=subj;
        const{error}=await sb.from('profiles').update(upd).eq('id',p.id);
        if(error){toast('Ошибка: '+error.message,'err');return;}
        S.prof={...S.prof,...upd};
        toast('Профиль обновлён');m.remove();render();
      },{variant:'primary'})
    )
  ];
  const m=modal('Мой профиль',content,()=>m.remove());
  document.body.appendChild(m);
}


async function render(){
  const app=document.getElementById('app');if(!app)return;app.innerHTML='';
  const{loading,user,prof,nav,cid}=S;
  if(loading){app.appendChild(dv({minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:C.bg},spin()));return;}
  if(!user||!prof){app.appendChild(pgLogin());return;}
  const layout=document.createElement('div');layout.className='app-layout';
  document.querySelectorAll('.sb-overlay,.mob-nav,.mob-bar').forEach(el=>el.remove());
  const sOverlay=document.createElement('div');sOverlay.className='sb-overlay';
  sOverlay.onclick=()=>{document.querySelector('.app-sidebar')?.classList.remove('open');sOverlay.classList.remove('on');};
  document.body.appendChild(sOverlay);
  layout.appendChild(pgSidebar(sOverlay));
  const main=document.createElement('main');main.className='app-main';main.style.background=C.bg;
  const isM=prof.role==='manager';const isT=prof.role==='teacher';const isSt=prof.role==='student';
  // Course detail — async load if needed
  if(nav==='course'&&cid){
    if(S.cloading){main.appendChild(spin());}
    else if(!S.cd||S.cd.id!==cid){
      // Запускаем загрузку, показываем спиннер
      main.appendChild(spin());layout.appendChild(main);app.appendChild(layout);
      loadCourseDetail(cid);return;
    } else {
      main.appendChild(pgCourseDetail());
    }
  }else if(isM&&nav==='dashboard')main.appendChild(pgDashboard());
  else if(isM&&nav==='courses')main.appendChild(pgCourses());
  else if(isM&&nav==='cal')main.appendChild(pgCal());
  else if(isM&&nav==='tasks')main.appendChild(pgTasks());
  else if(isM&&nav==='teachers')main.appendChild(pgTeachers());
  else if(nav==='msgs')main.appendChild(pgMsgs());
  else if(isM&&nav==='search')main.appendChild(pgSearch());
  else if(isT&&nav==='t-home')main.appendChild(pgTHome());
  else if(isT&&nav==='t-sched')main.appendChild(pgTSched());
  else if(isT&&nav==='t-tasks')main.appendChild(pgTTasks());
  else if(isT&&nav==='t-cal')main.appendChild(pgCal());
  else if(isT&&nav==='t-hw'){const hw=dv({});pgTHW().then(n=>{hw.appendChild(n);});main.appendChild(hw);}
  else if(isSt&&nav==='s-home')main.appendChild(pgSHome());
  else if(isSt&&nav==='s-sched')main.appendChild(pgSSched());
  else if(isSt&&nav==='s-mats')main.appendChild(pgSMats());
  else if(isSt&&nav==='s-docs')main.appendChild(pgSDocs());
  else if(isSt&&nav==='s-hw'){const shw=dv({});pgSHW().then(n=>{shw.appendChild(n);});main.appendChild(shw);}
  else main.appendChild(spin());
  layout.appendChild(main);app.appendChild(layout);
}

render();

// ─── BOOT ────────────────────────────────────────────────
async function boot(){
  try{
    const{data:{session}}=await sb.auth.getSession();
    if(session){
      const p=await loadProf(session.user.id);
      if(p){
        await loadAll(p);
        subMsgs(p);
        try{requestNotifyPerm();}catch(e){}
        setS({user:session.user,prof:p,loading:false,nav:defNav(p)});
      }else{
        await sb.auth.signOut();
        setS({loading:false});
      }
    }else{
      setS({loading:false});
    }
  }catch(e){
    console.error('Boot error:',e);
    setS({loading:false});
  }
}
// Run after DOM is ready
if(document.readyState==='loading'){
  document.addEventListener('DOMContentLoaded', boot);
}else{
  boot();
}

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js')
      .then(reg => console.log('SW registered:', reg.scope))
      .catch(err => console.log('SW failed:', err));
  });
}

// ── PWA INSTALL PROMPT ────────────────────────────────────
let _installPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  _installPrompt = e;
  // Show install button in topbar after 3 seconds
  setTimeout(() => {
    const topbar = document.querySelector('.mob-bar');
    if (!topbar || document.querySelector('.pwa-install-btn')) return;
    const btn = document.createElement('button');
    btn.className = 'pwa-install-btn';
    Object.assign(btn.style, {
      background: '#C17A3E', color: '#fff', border: 'none',
      borderRadius: '8px', padding: '5px 10px', fontSize: '.75rem',
      fontWeight: '700', cursor: 'pointer', display: 'flex',
      alignItems: 'center', gap: '4px', flexShrink: '0'
    });
    btn.innerHTML = '⬇️ Установить';
    btn.onclick = () => {
      _installPrompt.prompt();
      _installPrompt.userChoice.then(() => { _installPrompt = null; btn.remove(); });
    };
    topbar.appendChild(btn);
  }, 3000);
});
